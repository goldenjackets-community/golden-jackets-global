name: Update Global Stats

on:
  # Re-enabled (#41) with a per-chapter never-decrease guard + a global sanity
  # check that aborts on a suspicious drop, so a broken chapter deploy can no
  # longer overwrite good stats. Runs once a day; can also be run manually.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch chapter data and update stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp data.json data.json.bak

          # Snapshot current global totals for the safety check at the end.
          PREV_MEMBERS=$(jq -r '.stats.members' data.json)
          PREV_CERTS=$(jq -r '.stats.certifications' data.json)

          # Count members per chapter from the LIVE chapter site and apply a
          # per-chapter never-decrease: if a chapter deploy is broken (site count
          # is lower/zero), we KEEP the current data.json number for that chapter.
          # This is the guard that previously required the CRON to be disabled.
          CHANGED=0
          while IFS='|' read -r ID REPO BRANCH; do
            [ -z "$REPO" ] && continue
            echo "Fetching $ID ($REPO@$BRANCH)..."
            HTML=$(gh api "repos/$REPO/contents/index.html?ref=$BRANCH" --jq '.content' | base64 -d 2>/dev/null || echo "")
            MEMBERS_HTML=$(gh api "repos/$REPO/contents/members.html?ref=$BRANCH" --jq '.content' | base64 -d 2>/dev/null || echo "")

            if [ -z "$HTML" ] && [ -z "$MEMBERS_HTML" ]; then
              echo "  Skipped (no access) — keeping current count"
              continue
            fi

            CM=$(echo "$HTML" | grep -c 'class="member-card' || true)
            if [ "$CM" -eq 0 ] && [ -n "$MEMBERS_HTML" ]; then
              CM=$(echo "$MEMBERS_HTML" | grep -c 'class="card"' || true)
            fi

            CURRENT=$(jq -r --arg id "$ID" '.chapters[] | select(.id==$id) | .members // 0' data.json)
            if [ "$CM" -gt "$CURRENT" ]; then
              echo "  $ID: $CURRENT -> $CM (updated)"
              jq --arg id "$ID" --argjson n "$CM" \
                '(.chapters[] | select(.id==$id) | .members) = $n' data.json > data_tmp.json && mv data_tmp.json data.json
              CHANGED=1
            else
              echo "  $ID: keeping $CURRENT (site=$CM, not higher)"
            fi
          done < <(jq -r '.chapters[] | select(.status=="active" and .repo!="") | .id + "|" + .repo + "|" + .branch' data.json)

          # Recompute ALL aggregates + rewrite every index.html counter from the
          # (now updated) per-chapter data via the single source-of-truth tool.
          python3 scripts/update_global_counters.py --write

          # ----- GLOBAL SAFETY CHECK (never-decrease + sanity) -----
          NEW_MEMBERS=$(jq -r '.stats.members' data.json)
          echo "=== members: $PREV_MEMBERS -> $NEW_MEMBERS ==="

          # 1) Never-decrease on the global total (belt-and-suspenders on top of
          #    the per-chapter guard).
          # 2) Sanity: refuse a suspicious drop (>10%) that would indicate a
          #    systemic fetch failure rather than real data.
          if [ "$NEW_MEMBERS" -lt "$PREV_MEMBERS" ]; then
            THRESHOLD=$(( PREV_MEMBERS - (PREV_MEMBERS / 10) ))
            echo "::warning::New member total ($NEW_MEMBERS) is lower than current ($PREV_MEMBERS)."
            if [ "$NEW_MEMBERS" -lt "$THRESHOLD" ]; then
              echo "::error::Refusing to commit: drop below 90% of current ($THRESHOLD). Likely a broken chapter deploy or fetch failure. Reverting."
              mv data.json.bak data.json
              git checkout -- index.html 2>/dev/null || true
              exit 1
            fi
            echo "Drop is within tolerance; reverting to previous total to honor never-decrease."
            mv data.json.bak data.json
            python3 scripts/update_global_counters.py --write
          else
            rm -f data.json.bak
          fi

          echo "=== Final stats ==="
          jq '.stats' data.json

      - name: Commit if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "Auto-update stats: $(jq -r '.stats.members' data.json) members, $(jq -r '.stats.certifications' data.json) certs"
          git push
